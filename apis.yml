name: Taxdoo
description: 'Taxdoo is a Hamburg-based fintech providing real-time e-commerce accounting software
  for online retailers and tax advisors. The platform automatically captures sales, fees, payments,
  invoices, and contracts across 50+ marketplaces, shop systems, and payment providers (Amazon, eBay,
  Kaufland, Shopify, JTL, PayPal, Stripe, Klarna, Mollie), reconciles them into GoBD-compliant,
  audit-ready financial data, performs AI-based invoice verification, and exports daily to DATEV.
  Integrations are delivered as managed no-code connectors; Taxdoo does not publish a public developer
  API, developer portal, or API reference. Backed by Accel.'
